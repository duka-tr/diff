# Statik dosya sunucusu — erişim kaydı tutulmaz, karşılaştırma tamamen tarayıcıda yapılır.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    log_not_found off;
    server_tokens off;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Yalnızca okuma isteklerine izin ver.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Sayfa hiçbir dış kaynağa bağlanamaz; metinlerin dışarı sızması tarayıcı düzeyinde engellenir.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache" always;

    # Konteyner açılışında .env değerlerinden üretilen ayar dosyası.
    location = /config.js {
        alias /tmp/app-config.js;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
