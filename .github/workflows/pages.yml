name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/diff.test.js

  # Upload and deploy run in separate jobs: deploying right after uploading in the same job
  # intermittently fails to find the artifact (actions/deploy-pages#451).
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write   # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site
        run: |
          cp -r public _site
          # Cache busting: asset URLs get the commit id on every deploy.
          v="${GITHUB_SHA::8}"
          grep -rl '__V__' _site | xargs sed -i "s/__V__/$v/g"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
