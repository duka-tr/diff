<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Metin Karşılaştırma</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.svg" alt="" width="22" height="22">
      <h1 data-i18n="title">Metin Karşılaştırma</h1>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="themeBtn" class="icon-btn" data-i18n-title="theme" aria-label="Theme">◐</button>
    </div>
  </header>

  <main>
    <section class="inputs">
      <div class="pane" data-side="left">
        <div class="pane-head">
          <span class="pane-title" data-i18n="left">Orijinal</span>
          <span class="pane-count" id="leftCount"></span>
          <span class="spacer"></span>
          <label class="btn small"><input type="file" hidden data-file="left"><span data-i18n="openFile">Dosya aç</span></label>
          <button type="button" class="btn small ghost" data-clear="left" data-i18n="clear">Temizle</button>
        </div>
        <textarea id="leftText" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" data-i18n-ph="placeholderLeft"></textarea>
      </div>
      <div class="pane" data-side="right">
        <div class="pane-head">
          <span class="pane-title" data-i18n="right">Değiştirilmiş</span>
          <span class="pane-count" id="rightCount"></span>
          <span class="spacer"></span>
          <label class="btn small"><input type="file" hidden data-file="right"><span data-i18n="openFile">Dosya aç</span></label>
          <button type="button" class="btn small ghost" data-clear="right" data-i18n="clear">Temizle</button>
        </div>
        <textarea id="rightText" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" data-i18n-ph="placeholderRight"></textarea>
      </div>
    </section>

    <section class="options">
      <label class="opt">
        <span data-i18n="optWhitespace">Boşluklar</span>
        <select id="optWhitespace">
          <option value="none" data-i18n="wsNone">Dikkate al</option>
          <option value="trim" data-i18n="wsTrim">Baş/son boşlukları yok say</option>
          <option value="all" data-i18n="wsAll">Tüm boşlukları yok say</option>
        </select>
      </label>
      <label class="opt check"><input type="checkbox" id="optCase"><span data-i18n="optCase">Büyük/küçük harfi yok say</span></label>
      <label class="opt check" id="turkishWrap"><input type="checkbox" id="optTurkish"><span data-i18n="optTurkish" data-i18n-title="optTurkishHint">Türkçe harf kuralları</span></label>
      <label class="opt check"><input type="checkbox" id="optBlank"><span data-i18n="optBlank">Boş satırları yok say</span></label>
      <label class="opt">
        <span data-i18n="optInline">Satır içi fark</span>
        <select id="optInline">
          <option value="word" data-i18n="inlineWord">Kelime</option>
          <option value="char" data-i18n="inlineChar">Karakter</option>
          <option value="off" data-i18n="inlineOff">Kapalı</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="swapBtn" class="btn ghost">⇄ <span data-i18n="swap">Yer değiştir</span></button>
        <button type="button" id="compareBtn" class="btn primary" data-i18n-title="shortcutHint"><span data-i18n="compare">Karşılaştır</span></button>
      </div>
    </section>

    <section class="result" id="result" hidden>
      <div class="result-bar">
        <div class="stats" id="stats"></div>
        <span class="stale-note" id="staleNote" data-i18n="stale" hidden></span>
        <span class="spacer"></span>
        <div class="seg" role="group">
          <button type="button" data-view="split" data-i18n="viewSplit">Yan yana</button>
          <button type="button" data-view="unified" data-i18n="viewUnified">Tek sütun</button>
        </div>
        <label class="opt check"><input type="checkbox" id="optHide"><span data-i18n="hideUnchanged">Değişmeyenleri gizle</span></label>
        <label class="opt" id="contextWrap">
          <span data-i18n="context">Bağlam</span>
          <select id="optContext">
            <option value="0">0</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
        </label>
        <div class="nav">
          <button type="button" id="prevBtn" class="icon-btn" data-i18n-title="prev">↑</button>
          <span id="navPos" class="nav-pos"></span>
          <button type="button" id="nextBtn" class="icon-btn" data-i18n-title="next">↓</button>
        </div>
      </div>
      <div class="diff-wrap" id="diffWrap"></div>
    </section>
  </main>

  <footer class="footer" data-i18n="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
