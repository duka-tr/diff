services:
  difference-checker:
    build: .
    image: difference-checker:latest
    container_name: difference-checker
    restart: unless-stopped
    # Yalnızca makinenin içinden erişilebilir; dışarıya Cloudflare Tunnel ile açılır.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-7080}:8080"
    # Site ayarları .env dosyasından okunur (bkz. .env.example).
    environment:
      SITE_TITLE: ${SITE_TITLE:-}
      SITE_TAGLINE: ${SITE_TAGLINE:-}
      SITE_FOOTER: ${SITE_FOOTER:-}
      DEFAULT_LANG: ${DEFAULT_LANG:-}
      DEFAULT_THEME: ${DEFAULT_THEME:-}
      DEFAULT_VIEW: ${DEFAULT_VIEW:-}
      DEFAULT_HIDE_UNCHANGED: ${DEFAULT_HIDE_UNCHANGED:-}
      DEFAULT_CONTEXT: ${DEFAULT_CONTEXT:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
